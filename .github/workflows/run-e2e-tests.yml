name: Run E2E Tests

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  run-e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: docker
          POSTGRES_PASSWORD: docker
          POSTGRES_DB: findafriend
        options: >-
          --health-cmd="pg_isready -U docker -d findafriend"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://docker:docker@localhost:5432/findafriend
      JWT_SECRET: ci-test-secret
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Run E2E tests
        run: pnpm test:e2e:run
